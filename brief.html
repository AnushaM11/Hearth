<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household brief</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1b1f; --mut:#6b6b76; --card:#f4f4f7;
          --over:#c62828; --week:#e65100; --month:#1565c0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#f1f1f4; --mut:#9a9aa6; --card:#232329; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:16px/1.4 system-ui, sans-serif; }
  h1 { font-size:1.1rem; margin:0 0 12px; }
  .group { margin:0 0 14px; }
  .group h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; margin:0 0 6px; }
  .overdue h2 { color:var(--over); } .this_week h2 { color:var(--week); } .this_month h2 { color:var(--month); }
  .row { display:flex; justify-content:space-between; gap:12px; background:var(--card);
         padding:10px 12px; border-radius:10px; margin-bottom:6px; }
  .when { color:var(--mut); white-space:nowrap; }
  .empty { color:var(--mut); }
</style>
</head>
<body>
<h1>Household brief</h1>
<div id="root" class="empty">Waiting for data…</div>
<script>
  // Minimal MCP Apps view: render whatever structured result the host sends.
  const LABEL = { overdue:"Overdue", this_week:"This week", this_month:"This month" };
  function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function render(b){
    const root = document.getElementById("root");
    const parts = Object.keys(LABEL).filter(k => (b[k]||[]).length).map(k =>
      `<section class="group ${k}"><h2>${LABEL[k]}</h2>` +
      b[k].map(d => `<div class="row"><span>${esc(d.name)}</span>` +
        `<span class="when">${d.days_left < 0 ? Math.abs(d.days_left)+" days late" : d.days_left+" days"}</span></div>`).join("") +
      `</section>`);
    root.className = parts.length ? "" : "empty";
    root.innerHTML = parts.length ? parts.join("") : "Nothing needs your attention right now.";
  }
  window.addEventListener("message", (e) => {
    const m = e.data;
    const result = m && m.params && (m.params.structuredContent || m.params);
    if (m && m.method === "ui/notifications/tool-result" && result) render(result);
  });
  try { window.parent.postMessage({ jsonrpc:"2.0", method:"ui/notifications/initialized", params:{} }, "*"); } catch (e) {}
</script>
</body>
</html>
